<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Fresh Fruit Online in Karachi | Zayka Harvest</title>
    <meta name="description" content="Place your order online for fresh seasonal fruits in Karachi with fast home delivery.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">Zayka Harvest</a>
        <nav aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="booking.html" class="active">Book Order</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="container">
        <h2>Online Fruit Booking Form</h2>
        
        <div class="form-container">
            <form id="bookingForm">
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" placeholder="03XXXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label for="fruitSelect">Select Fruit Basket:</label>
                    <select id="fruitSelect" required>
                        <option value="">-- Choose Package --</option>
                        <option value="mango">Mango Basket (5 Kg)</option>
                        <option value="apple">Kashmiri Red Apples (3 Kg)</option>
                        <option value="mixed">Mixed Family Fruit Basket (10 Kg)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Delivery Address in Karachi:</label>
                    <textarea id="address" rows="3" placeholder="House #, Street #, Area (e.g. DHA Phase 5)" required></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Confirm Order</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Zayka Harvest Karachi | <a href="index.html">Home</a> | <a href="contact.html">Contact Us</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
