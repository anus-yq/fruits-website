<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Zayka Harvest Karachi</title>
    <meta name="description" content="Get in touch with Zayka Harvest for queries or bulk fruit orders in Karachi.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">Zayka Harvest</a>
        <nav aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="booking.html">Book Order</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main class="container">
        <h2>Get In Touch With Us</h2>
        
        <div class="form-container">
            <p style="text-align: center; margin-bottom: 1.5rem; color: #555;">Have any questions? Send us a message!</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label for="cName">Your Name:</label>
                    <input type="text" id="cName" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="cEmail">Email Address:</label>
                    <input type="email" id="cEmail" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="cMessage">Your Message:</label>
                    <textarea id="cMessage" rows="4" placeholder="Type your message here..." required></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Zayka Harvest Karachi | <a href="index.html">Home</a> | <a href="booking.html">Book Order</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
